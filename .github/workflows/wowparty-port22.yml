name: WowParty Rescue port check

on:
  push:
    branches:
      - ops/wowparty-rescue-20260803
    paths:
      - .github/workflows/wowparty-port22.yml

permissions:
  contents: read
  statuses: write

jobs:
  port-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check port 22
        id: port
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if nc -zvw5 89.167.115.150 22; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish port status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORT_OUTCOME: ${{ steps.port.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description='Rescue SSH port 22 is unreachable'
          if [ "$PORT_OUTCOME" = success ]; then
            state=success
            description='Rescue SSH port 22 is reachable'
          fi
          payload="$(jq -n --arg state "$state" --arg context wowparty/rescue-port22 --arg description "$description" '{state:$state,context:$context,description:$description}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Preserve port result
        if: steps.port.outcome != 'success'
        run: exit 1
