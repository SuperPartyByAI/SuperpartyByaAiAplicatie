name: ZOUKASPLAY live runner probe

on:
  push:
    branches:
      - ops/zoukasplay-live-500sqm-20260803
    paths:
      - .github/workflows/zoukasplay-runner-probe.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: zoukasplay-live-500sqm
  cancel-in-progress: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending probe status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -n             --arg state pending             --arg context zoukasplay/runner-probe             --arg description 'Waiting for guarded Hetzner runner'             --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error             -X POST             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer $GITHUB_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d "$payload"

  probe:
    needs: announce
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify Zouka live process read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = 'wa-production-cpx41ubuntu-32gb-hell1-2'
          test -d /var/www/zoukasplay-ssr
          command -v pm2 >/dev/null
          pm2 describe zoukasplay-site >/dev/null
          pm2 jlist | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk).on("end", () => {
              const proc = JSON.parse(input).find(item => item.name === "zoukasplay-site");
              const env = proc?.pm2_env || {};
              const state = {
                found: Boolean(proc),
                status: env.status || "missing",
                cwd: env.pm_cwd || null,
                script: env.pm_exec_path || null,
                port: env.PORT || null
              };
              console.log(JSON.stringify(state));
              if (!proc || env.pm_cwd !== "/var/www/zoukasplay-ssr" || env.pm_exec_path !== "/var/www/zoukasplay-ssr/dist/server/entry.mjs") process.exit(1);
            });
          '
          curl -fsS --max-time 10 https://zoukasplay.ro/ | grep -q '1000m²'

      - name: Publish final probe status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description='Guarded Hetzner runner and Zouka process verified'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            description='Hetzner runner or Zouka guard failed'
          fi
          payload="$(jq -n             --arg state "$state"             --arg context zoukasplay/runner-probe             --arg description "$description"             --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error             -X POST             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer $GITHUB_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d "$payload"
