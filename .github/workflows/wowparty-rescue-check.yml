name: WowParty rescue access check

on:
  push:
    branches:
      - ops/wowparty-rescue-20260803
    paths:
      - .github/workflows/wowparty-rescue-check.yml

permissions:
  contents: read
  statuses: write

jobs:
  rescue-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Rescue SSH access
        id: rescue
        continue-on-error: true
        shell: bash
        env:
          RESCUE_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RESCUE_SSH_KEY" ]; then
            echo "SSH_PRIVATE_KEY is not configured"
            exit 2
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RESCUE_SSH_KEY" > "$HOME/.ssh/wowparty_rescue"
          chmod 600 "$HOME/.ssh/wowparty_rescue"

          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -T 5 -H 89.167.115.150 > "$HOME/.ssh/known_hosts" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          test -s "$HOME/.ssh/known_hosts"
          ssh \
            -i "$HOME/.ssh/wowparty_rescue" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            root@89.167.115.150 \
            'printf "RESCUE_OK\\n"; uname -srm; lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS'

      - name: Publish diagnostic status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESCUE_OUTCOME: ${{ steps.rescue.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description="Rescue SSH access failed"
          if [ "$RESCUE_OUTCOME" = "success" ]; then
            state=success
            description="Rescue SSH access confirmed"
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg context "wowparty/rescue-access" \
            --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Preserve failure result
        if: steps.rescue.outcome != 'success'
        run: exit 1
