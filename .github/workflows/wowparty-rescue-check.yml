name: WowParty guarded Rescue deploy

on:
  push:
    branches:
      - ops/wowparty-rescue-20260803
    paths:
      - .github/workflows/wowparty-rescue-check.yml

permissions:
  contents: read
  statuses: write

jobs:
  rescue-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Load the guarded payload
        uses: actions/checkout@v4

      - name: Generate an ephemeral Rescue key
        id: rescue_key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/wowparty_rescue_key"
          ssh-keygen -q -t ed25519 -N '' -f "$key_path" -C "wowparty-rescue-$GITHUB_RUN_ID"
          key_body="$(awk '{print $2}' "$key_path.pub")"
          install -d -m 700 "$HOME/.ssh"
          printf 'KEY_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"

          payload="$(jq -n \
            --arg state pending \
            --arg context "wowparty/rescue-key/$key_body" \
            --arg description 'Ephemeral Rescue public key ready' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Wait for Rescue, deploy, and return to the live disk
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          known_hosts="$RUNNER_TEMP/known_hosts"
          ssh_base=(
            -i "$KEY_PATH"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=8
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$known_hosts"
          )

          connected=0
          for attempt in $(seq 1 180); do
            # The live OS and the one-shot Rescue OS have different SSH host keys.
            # Drop the previously observed key before each transition probe.
            : > "$known_hosts"
            if ssh "${ssh_base[@]}" root@89.167.115.150 'test -f /etc/os-release' >/dev/null 2>&1; then
              connected=1
              break
            fi
            sleep 5
          done
          if [ "$connected" -ne 1 ]; then
            echo 'Timed out waiting for the Rescue SSH key'
            exit 30
          fi

          echo 'Rescue SSH access confirmed'
          ssh "${ssh_base[@]}" root@89.167.115.150 'mkdir -p /root/wowparty-rescue-payload'
          cp "$KEY_PATH.pub" ops/wowparty-rescue/payload/ephemeral.pub
          scp "${ssh_base[@]}" \
            ops/wowparty-rescue/payload/wowparty-agent.js \
            ops/wowparty-rescue/payload/job-worker.js \
            ops/wowparty-rescue/payload/page.tsx \
            ops/wowparty-rescue/payload/EvenimenteClient.tsx \
            ops/wowparty-rescue/payload/ephemeral.pub \
            ops/wowparty-rescue/rescue-deploy.sh \
            root@89.167.115.150:/root/wowparty-rescue-payload/

          ssh "${ssh_base[@]}" root@89.167.115.150 \
            "chmod +x /root/wowparty-rescue-payload/rescue-deploy.sh && WOWPARTY_RUN_TAG='$GITHUB_RUN_ID' /root/wowparty-rescue-payload/rescue-deploy.sh"

          sleep 12
          : > "$known_hosts"
          live_connected=0
          for attempt in $(seq 1 180); do
            : > "$known_hosts"
            if ssh "${ssh_base[@]}" root@89.167.115.150 'test -d /opt/superparty/backend' >/dev/null 2>&1; then
              live_connected=1
              break
            fi
            sleep 5
          done
          if [ "$live_connected" -ne 1 ]; then
            echo 'Timed out waiting for the live operating system'
            exit 31
          fi

          echo 'Live operating system is back'
          ssh "${ssh_base[@]}" root@89.167.115.150 'bash -s' <<'LIVE_CHECK' | tee "$RUNNER_TEMP/wowparty-postboot.txt"
          set -Eeuo pipefail
          export WA_OUTBOUND_ENABLED=false

          worker_file="/opt/superparty/backend/src/agents/job-worker.js"
          if [ ! -f "$worker_file" ]; then
            mapfile -t worker_candidates < <(
              find /opt -xdev -type f -name 'job-worker.js' \
                -not -path '*/node_modules/*' \
                -not -path '*/.git/*' \
                -not -path '*/backup/*' \
                -not -path '*/backups/*' \
                -not -path '*/archive/*' \
                -not -path '*/archives/*' \
                -print
            )
            if [ "${#worker_candidates[@]}" -ne 1 ]; then
              echo "Expected one live job-worker.js, found ${#worker_candidates[@]}"
              exit 40
            fi
            worker_file="${worker_candidates[0]}"
          fi

          node --check "$(dirname "$worker_file")/wowparty-agent.js"
          node --check "$worker_file"

          if ! command -v pm2 >/dev/null 2>&1; then
            echo 'PM2 is not installed on the live system'
            exit 41
          fi

          if pm2 describe wowparty-agent-worker >/dev/null 2>&1; then
            WA_OUTBOUND_ENABLED=false pm2 restart wowparty-agent-worker --update-env
          else
            WA_OUTBOUND_ENABLED=false pm2 start "$worker_file" --name wowparty-agent-worker --time
          fi
          pm2 save

          worker_status="$(pm2 jlist | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const p=JSON.parse(d).find(x=>x.name==='wowparty-agent-worker');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "WOWPARTY_AGENT_WORKER_STATUS=$worker_status"
          test "$worker_status" = online

          portal_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-redirs 0 https://app.superparty.ro/wowparty || true)"
          echo "WOWPARTY_PORTAL_HTTP=$portal_code"
          case "$portal_code" in
            200|307) ;;
            *) exit 42 ;;
          esac

          latest_report="$(ls -1t /root/wowparty-rescue-deploy-*.txt 2>/dev/null | head -n 1 || true)"
          if [ -n "$latest_report" ]; then
            cat "$latest_report"
          fi
          pm2 logs wowparty-agent-worker --nostream --lines 40 || true
          systemctl --failed --no-pager || true
          LIVE_CHECK

      - name: Upload the post-boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wowparty-rescue-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/wowparty-postboot.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish the final Rescue result
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description='WowParty Rescue deploy failed'
          if [ "$DEPLOY_OUTCOME" = success ]; then
            state=success
            description='WowParty patched, built, rebooted, and verified'
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg context wowparty/rescue-deploy \
            --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Preserve the deploy result
        if: steps.deploy.outcome != 'success'
        run: exit 1
