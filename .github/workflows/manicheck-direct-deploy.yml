name: MANICHECK direct sealed deployment

on:
  push:
    branches:
      - codex/manicheck-direct-deploy-20260803
    paths:
      - .github/workflows/manicheck-direct-deploy.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: manicheck-direct-live
  cancel-in-progress: true

jobs:
  deploy:
    # Execute on the Hetzner machine itself.  The host guard below makes the
    # job fail closed if GitHub ever assigns another self-hosted runner.
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify the direct MANICHECK host
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = 'wa-production-cpx41ubuntu-32gb-hell1-2'
          test -d /opt/manicheck-site
          test -f /etc/nginx/sites-enabled/manicheck.ro.conf -o -f /etc/nginx/sites-available/manicheck.ro.conf
          sudo -n true

      - name: Reassemble and verify the sealed payload
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$RUNNER_TEMP/manicheck-rescue-deploy"
          mkdir -p "$payload"
          cat ops/manicheck-rescue/payload/manicheck-v1-dist-text.tar.gz.b64.* | base64 -d > "$payload/manicheck-v1-dist-text.tar.gz"
          cat ops/manicheck-rescue/payload/manicheck-v1-text-source.tar.gz.b64.* | base64 -d > "$payload/manicheck-v1-text-source.tar.gz"
          cat ops/manicheck-rescue/payload/og-image.png.b64.* | base64 -d > "$payload/og-image.png"
          cp ops/manicheck-rescue/deploy-direct-live.sh "$payload/"
          cp ops/manicheck-rescue/MANICHECK_STORE_V1_MANIFEST.txt "$payload/"
          chmod +x "$payload/deploy-direct-live.sh"
          test "$(sha256sum "$payload/manicheck-v1-dist-text.tar.gz" | awk '{print $1}')" = "29608a881ea214c91d6f31e20f11130f722b52a7eed9d81b951296f42f107ff5"
          test "$(sha256sum "$payload/manicheck-v1-text-source.tar.gz" | awk '{print $1}')" = "29873515d784073cc27d9ed0efd565e6fab8b807cb6c2e7c046d5d08527642fb"
          test "$(sha256sum "$payload/og-image.png" | awk '{print $1}')" = "72e23903cf5c5a8ccf08cbc9622d2d69e5ae0d08b789bddd5f7f0dc906d52c83"
          test "$(sha256sum "$payload/deploy-direct-live.sh" | awk '{print $1}')" = "646e378255bdd25b3e0fe711327e954b1b0a058d6746c3257ae486b0c09da275"
          test "$(sha256sum "$payload/MANICHECK_STORE_V1_MANIFEST.txt" | awk '{print $1}')" = "8536f74663c478042f6dc427323a1e1e95a0f9580d62dec8732ed78e775c4d40"
          tar -tzf "$payload/manicheck-v1-dist-text.tar.gz" >/dev/null
          tar -tzf "$payload/manicheck-v1-text-source.tar.gz" >/dev/null
          bash -n "$payload/deploy-direct-live.sh"
          printf 'PAYLOAD_DIR=%s\n' "$payload" >> "$GITHUB_ENV"

      - name: Deploy locally on Hetzner and verify public LIVE
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo install -d -m 700 /root/manicheck-direct-deploy
          sudo install -m 600 \
            "$PAYLOAD_DIR/manicheck-v1-dist-text.tar.gz" \
            "$PAYLOAD_DIR/manicheck-v1-text-source.tar.gz" \
            "$PAYLOAD_DIR/og-image.png" \
            "$PAYLOAD_DIR/MANICHECK_STORE_V1_MANIFEST.txt" \
            /root/manicheck-direct-deploy/
          sudo install -m 700 "$PAYLOAD_DIR/deploy-direct-live.sh" /root/manicheck-direct-deploy/deploy-direct-live.sh
          sudo env MANICHECK_RUN_TAG="$GITHUB_RUN_ID" \
            /root/manicheck-direct-deploy/deploy-direct-live.sh \
            | tee "$RUNNER_TEMP/manicheck-deploy.txt"

          live_ok=0
          for attempt in $(seq 1 120); do
            body="$(curl -fsS --max-time 10 "https://manicheck.ro/?deploy_qa=$GITHUB_RUN_ID" || true)"
            if printf '%s' "$body" | grep -q 'Magazin online afiliat pentru manichiură' \
              && printf '%s' "$body" | grep -q 'Produse</dt><dd[^>]*>20</dd>' \
              && ! printf '%s' "$body" | grep -qi 'Agregator premium\|Comparăm modele'; then
              live_ok=1
              break
            fi
            sleep 5
          done
          if [ "$live_ok" -ne 1 ]; then
            echo 'MANICHECK LIVE did not expose the verified V1 storefront in time'
            exit 31
          fi

          curl -fsS --max-time 10 https://manicheck.ro/robots.txt | grep -q 'Allow: /'
          curl -fsS --max-time 10 https://manicheck.ro/cos/ | grep -q 'Coșul meu'
          curl -fsS --max-time 10 https://manicheck.ro/favorite/ | grep -q 'Favorite'
          echo 'MANICHECK LIVE deployment verified' | tee -a "$RUNNER_TEMP/manicheck-deploy.txt"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manicheck-live-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/manicheck-deploy.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish final deployment status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          state=success
          description='MANICHECK V1 is live and verified'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            description='MANICHECK direct deployment failed'
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg context manicheck/live-deploy \
            --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
