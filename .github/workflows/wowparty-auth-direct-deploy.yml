name: WowParty minimal auth hotfix via Hetzner API

on:
  push:
    branches:
      - ops/wowparty-rescue-20260803
    paths:
      - .github/workflows/wowparty-auth-direct-deploy.yml
      - ops/wowparty-auth/deploy-auth.sh

permissions:
  contents: read
  statuses: write

concurrency:
  group: wowparty-auth-live
  cancel-in-progress: true

jobs:
  deploy-auth-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish deploy start
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          payload="$(jq -n \
            --arg state pending \
            --arg context wowparty/auth-live \
            --arg description 'Hetzner API auth hotfix started' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Deploy through Hetzner API access
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$HCLOUD_TOKEN"

          server_id=126425479
          server_ip=89.167.115.150
          api_base=https://api.hetzner.cloud/v1
          auth_header="Authorization: Bearer $HCLOUD_TOKEN"

          server_json="$(curl --fail-with-body --silent --show-error \
            -H "$auth_header" \
            "$api_base/servers/$server_id")"
          SERVER_JSON="$server_json" SERVER_ID="$server_id" SERVER_IP="$server_ip" node -e '
            const body = JSON.parse(process.env.SERVER_JSON || "{}");
            const server = body.server || {};
            const expectedId = Number(process.env.SERVER_ID);
            const expectedIp = process.env.SERVER_IP;
            if (server.id !== expectedId) process.exit(1);
            if (server.public_net?.ipv4?.ip !== expectedIp) process.exit(2);
            if (server.status !== "running") process.exit(3);
          '

          reset_json="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "$auth_header" \
            -H 'Content-Type: application/json' \
            "$api_base/servers/$server_id/actions/reset_password")"
          root_password="$(jq -er '.root_password' <<<"$reset_json")"
          echo "::add-mask::$root_password"

          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

          ssh_options=(
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o ConnectTimeout=10
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=accept-new
          )

          connected=0
          for attempt in $(seq 1 12); do
            if sshpass -p "$root_password" ssh "${ssh_options[@]}" root@"$server_ip" \
              'test -d /opt/superparty-portal' >/dev/null 2>&1; then
              connected=1
              break
            fi
            sleep 3
          done
          if [ "$connected" -ne 1 ]; then
            echo 'Hetzner API reset succeeded, but live SSH password login is disabled'
            exit 31
          fi

          sshpass -p "$root_password" ssh "${ssh_options[@]}" root@"$server_ip" \
            "WOWPARTY_HOTFIX_RUN='$GITHUB_RUN_ID' bash -s" \
            < ops/wowparty-auth/deploy-auth.sh

      - name: Publish deploy result
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          state=failure
          description='Hetzner API auth hotfix failed'
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='WowParty auth loop fixed and live portal verified'
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg context wowparty/auth-live \
            --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
